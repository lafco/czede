<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- czede — cubo isométrico com três tiers no topo (mesma geometria do logo
       do OpenChamber), em azul, SEM fundo: transparência para o desktop,
       favicon e PWA. ios-1024 e apple-touch usam czede-square.svg (timbre
       opaco, porque o sistema pinta o fundo que faltar). -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="30" y1="12" x2="70" y2="50">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="left" gradientUnits="userSpaceOnUse" x1="18" y1="26" x2="50" y2="98">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="right" gradientUnits="userSpaceOnUse" x1="82" y1="26" x2="50" y2="98">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <g transform="translate(50 50) scale(0.86)">
    <path d="M-41.568 -24 L0 0 L0 48 L-41.568 24 Z" fill="url(#left)"/>
    <path d="M0 0 L41.568 -24 L41.568 24 L0 48 Z" fill="url(#right)"/>
    <path d="M0 -48 L41.568 -24 L0 0 L-41.568 -24 Z" fill="url(#top)"/>
    <path d="M0 -43.2 L33.254 -24 L0 -4.8 L-33.254 -24 Z" fill="#dbeafe" fill-opacity="0.16"/>
    <path d="M0 -37.92 L24.109 -24 L0 -10.08 L-24.109 -24 Z" fill="#dbeafe" fill-opacity="0.3"/>
    <path d="M0 -32.64 L14.964 -24 L0 -15.36 L-14.964 -24 Z" fill="#eff6ff" fill-opacity="0.95"/>
    <g fill="none" stroke="#93c5fd" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.85">
      <path d="M0 -48 L-41.568 -24 L0 0 L41.568 -24 Z"/>
      <path d="M-41.568 -24 L-41.568 24 L0 48 L41.568 24 L41.568 -24"/>
      <path d="M0 0 L0 48"/>
    </g>
  </g>
</svg>
